# cargo-deny configuration — license whitelist, source restriction, ban policy.

[graph]
# Primary target matrix.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
# cargo-audit integration — block known CVEs.
version = 2
yanked = "deny"

[licenses]
# Dual MIT + Apache-2.0 mandate. GPL-family rejected.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.93

[bans]
# `multiple-versions = "warn"` (not "deny") is INTENTIONAL and reviewed:
# the PQC Hybrid mandate pairs `ed25519-dalek` 2.x (first-generation
# RustCrypto trait stack: `signature` 2.x + `digest` 0.10) with `ml-dsa`
# 0.1.1 (next-generation stack: `signature` 3.x + `digest` 0.11). The two
# generations cannot be collapsed while BOTH signing schemes are required,
# so a small, known set of crypto trait/util crates (`signature`,
# `digest`, and their `crypto-common`/`block-buffer` companions) appears
# at two versions. This is an accepted, benign duplication; the warning
# surfaces it for review each build rather than hiding it. Any NEW,
# unexpected duplicate beyond this set should be investigated.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
# crates.io only. No git deps.
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
